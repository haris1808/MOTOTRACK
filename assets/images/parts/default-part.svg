<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="defaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="defGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2" filter="url(#defGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(6, 182, 212, 0.08)" />

  <!-- Gear Cog -->
  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="url(#defaultGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#67e8f9" stroke-width="2"/>
    
    <!-- 8 Gear Teeth -->
    <path d="
      M -4 -30 L 4 -30 L 3 -22 L -3 -22 Z
      M -4 30 L 4 30 L 3 22 L -3 22 Z
      M -30 -4 L -30 4 L -22 3 L -22 -3 Z
      M 30 -4 L 30 4 L 22 3 L 22 -3 Z
      M -22 -22 L -16 -28 L -12 -22 L -18 -16 Z
      M 22 22 L 16 28 L 12 22 L 18 16 Z
      M -22 22 L -28 16 L -22 12 L -16 18 Z
      M 22 -22 L 28 -16 L 22 -12 L 16 -18 Z
    " fill="url(#defaultGrad)"/>

    <!-- Cross Wrench -->
    <path d="M -18 -8 L -8 -18 L 18 8 L 8 18 Z" fill="#94a3b8"/>
  </g>
</svg>
