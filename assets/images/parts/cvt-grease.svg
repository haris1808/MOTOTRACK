<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="greaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="greaseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(168, 85, 247, 0.25)" stroke-width="2" filter="url(#greaseGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(168, 85, 247, 0.08)" />

  <g transform="rotate(-25 60 60)">
    <!-- Cap -->
    <rect x="54" y="16" width="12" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <!-- Nozzle -->
    <path d="M 52 26 L 68 26 L 66 38 L 54 38 Z" fill="#cbd5e1"/>

    <!-- Tube Body -->
    <path d="M 44 38 L 76 38 L 84 94 L 36 94 Z" fill="url(#greaseGrad)" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Crimped End (Bottom) -->
    <rect x="34" y="94" width="52" height="8" rx="2" fill="#581c87" stroke="#9333ea" stroke-width="1"/>

    <!-- Label -->
    <rect x="42" y="50" width="36" height="34" rx="3" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="60" y="65" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="8" text-anchor="middle">CVT</text>
    <text x="60" y="76" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="6" text-anchor="middle">GREASE</text>
  </g>
</svg>
