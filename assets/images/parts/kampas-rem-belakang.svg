<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="drumMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="drumLining" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="drumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(59, 130, 246, 0.25)" stroke-width="2" filter="url(#drumGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(59, 130, 246, 0.08)" />

  <!-- Left Brake Shoe (Curved half-circle) -->
  <g transform="translate(60,60)">
    <!-- Left Shoe -->
    <path d="M -8 -36 C -38 -34 -44 -10 -44 0 C -44 10 -38 34 -8 36 L -8 24 C -28 22 -32 6 -32 0 C -32 -6 -28 -22 -8 -24 Z" fill="url(#drumMetal)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Friction Lining -->
    <path d="M -10 -34 C -36 -32 -42 -10 -42 0 C -42 10 -36 32 -10 34" fill="none" stroke="url(#drumLining)" stroke-width="5" stroke-linecap="round"/>

    <!-- Right Shoe -->
    <path d="M 8 -36 C 38 -34 44 -10 44 0 C 44 10 38 34 8 36 L 8 24 C 28 22 32 6 32 0 C 32 -6 28 -22 8 -24 Z" fill="url(#drumMetal)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Friction Lining -->
    <path d="M 10 -34 C 36 -32 42 -10 42 0 C 42 10 36 32 10 34" fill="none" stroke="url(#drumLining)" stroke-width="5" stroke-linecap="round"/>

    <!-- Connecting Tension Springs -->
    <line x1="-12" y1="-28" x2="12" y2="-28" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,2"/>
    <line x1="-12" y1="28" x2="12" y2="28" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,2"/>
  </g>
</svg>
