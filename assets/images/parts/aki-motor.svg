<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="posPole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="negPole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="akiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" filter="url(#akiGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(245, 158, 11, 0.08)" />

  <!-- Positive Terminal Left (+) -->
  <rect x="36" y="24" width="14" height="10" rx="2" fill="url(#posPole)" stroke="#fca5a5" stroke-width="1"/>
  <!-- Negative Terminal Right (-) -->
  <rect x="70" y="24" width="14" height="10" rx="2" fill="url(#negPole)" stroke="#93c5fd" stroke-width="1"/>

  <!-- Battery Main Casing -->
  <rect x="26" y="34" width="68" height="62" rx="6" fill="url(#batteryGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Top Lid Accent -->
  <rect x="26" y="34" width="68" height="12" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Battery Label Graphic -->
  <rect x="32" y="52" width="56" height="38" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Lightning Bolt Icon -->
  <path d="M 62 56 L 52 70 L 60 70 L 56 84 L 68 68 L 60 68 Z" fill="#f59e0b" stroke="#fde047" stroke-width="0.5"/>

  <!-- Polar Signs -->
  <text x="43" y="66" fill="#ef4444" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">+</text>
  <text x="77" y="66" fill="#3b82f6" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">-</text>
  
  <text x="60" y="86" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="6" text-anchor="middle">12V MF BATTERY</text>
</svg>
