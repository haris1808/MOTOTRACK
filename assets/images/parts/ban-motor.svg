<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="tireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" filter="url(#tireGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(56, 189, 248, 0.08)" />

  <!-- Outer Rubber Tire Profile -->
  <circle cx="60" cy="60" r="42" fill="url(#rubberGrad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Tire Tread Grooves around perimeter -->
  <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="20" x2="60" y2="28"/>
    <line x1="60" y1="92" x2="60" y2="100"/>
    <line x1="20" y1="60" x2="28" y2="60"/>
    <line x1="92" y1="60" x2="100" y2="60"/>
    
    <line x1="32" y1="32" x2="38" y2="38"/>
    <line x1="82" y1="82" x2="88" y2="88"/>
    <line x1="32" y1="88" x2="38" y2="82"/>
    <line x1="82" y1="38" x2="88" y2="32"/>
  </g>

  <!-- Alloy Rim -->
  <circle cx="60" cy="60" r="28" fill="#0f172a" stroke="url(#rimGrad)" stroke-width="3"/>
  <circle cx="60" cy="60" r="10" fill="url(#rimGrad)"/>
  <circle cx="60" cy="60" r="4" fill="#0f172a"/>

  <!-- 5 Rim Spokes -->
  <g stroke="url(#rimGrad)" stroke-width="3.5" stroke-linecap="round">
    <line x1="60" y1="60" x2="60" y2="34"/>
    <line x1="60" y1="60" x2="84" y2="52"/>
    <line x1="60" y1="60" x2="75" y2="80"/>
    <line x1="60" y1="60" x2="45" y2="80"/>
    <line x1="60" y1="60" x2="36" y2="52"/>
  </g>
</svg>
