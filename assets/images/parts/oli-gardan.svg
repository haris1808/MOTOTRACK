<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gearTubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" filter="url(#gearGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(16, 185, 129, 0.08)" />

  <!-- Nozzle Tip -->
  <path d="M 57 14 L 63 14 L 65 32 L 55 32 Z" fill="url(#nozzleGrad)" stroke="#fef08a" stroke-width="1"/>
  <!-- Nozzle Ring -->
  <rect x="52" y="32" width="16" height="6" rx="1.5" fill="#f59e0b"/>

  <!-- Tube Body (Squeeze bottle) -->
  <path d="M 52 38 L 68 38 C 76 44 82 56 82 82 C 82 98 78 104 60 104 C 42 104 38 98 38 82 C 38 56 44 44 52 38 Z" fill="url(#gearTubeGrad)" stroke="#6ee7b7" stroke-width="1.5"/>

  <!-- Gear Cog Graphics on Tube -->
  <g transform="translate(60, 72) scale(0.65)" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round">
    <circle cx="0" cy="0" r="14" fill="#064e3b" stroke="#34d399"/>
    <circle cx="0" cy="0" r="6" fill="#34d399" stroke="none"/>
    <path d="M 0 -18 L 0 -14 M 0 14 L 0 18 M -18 0 L -14 0 M 14 0 L 18 0 M -12 -12 L -9 -9 M 9 9 L 12 12 M -12 12 L -9 9 M 9 -9 L 12 -12" stroke="#34d399" stroke-width="4"/>
  </g>
  <rect x="48" y="90" width="24" height="4" rx="2" fill="#a7f3d0"/>
</svg>
