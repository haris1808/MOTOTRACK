<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="busiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" filter="url(#busiGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(56, 189, 248, 0.08)" />

  <g transform="rotate(-35 60 60)">
    <!-- Terminal Nut -->
    <rect x="56" y="14" width="8" height="8" rx="2" fill="url(#metalGrad)" stroke="#475569" stroke-width="1"/>
    
    <!-- Ceramic Ribs (Insulator) -->
    <rect x="53" y="22" width="14" height="26" rx="3" fill="url(#ceramicGrad)" stroke="#94a3b8" stroke-width="1"/>
    <line x1="51" y1="28" x2="69" y2="28" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="51" y1="34" x2="69" y2="34" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="51" y1="40" x2="69" y2="40" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Hex Nut Body -->
    <path d="M 48 48 L 72 48 L 76 62 L 44 62 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Threaded Metal Body -->
    <rect x="50" y="62" width="20" height="24" fill="url(#metalGrad)" stroke="#334155" stroke-width="1.5"/>
    <line x1="48" y1="67" x2="72" y2="67" stroke="#1e293b" stroke-width="2"/>
    <line x1="48" y1="73" x2="72" y2="73" stroke="#1e293b" stroke-width="2"/>
    <line x1="48" y1="79" x2="72" y2="79" stroke="#1e293b" stroke-width="2"/>

    <!-- Electrode Tip -->
    <rect x="58" y="86" width="4" height="12" fill="#e2e8f0"/>
    <path d="M 50 86 L 50 102 L 56 102" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Electric Spark -->
    <path d="M 58 98 L 64 94 L 60 101 L 68 97" fill="none" stroke="url(#sparkGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
