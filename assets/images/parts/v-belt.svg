  <!-- Belt Teeth / Grooves -->
  <path d="
    M 34 50 L 36 54 M 42 47 L 44 51 M 50 45 L 52 49 M 58 43 L 60 47 M 66 42 L 68 46 M 74 41 L 76 45
    M 34 70 L 36 66 M 42 73 L 44 69 M 50 75 L 52 71 M 58 77 L 60 73 M 66 78 L 68 74 M 74 79 L 76 75
  " stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
