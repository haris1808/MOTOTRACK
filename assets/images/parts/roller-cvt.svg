<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rollerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rollerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="rollerCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="rollerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" filter="url(#rollerGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(245, 158, 11, 0.08)" />

  <!-- 3 Isometric Cylindrical Rollers -->
  <!-- Roller 1 (Left-back) -->
  <g transform="translate(36, 44)">
    <rect x="-14" y="-8" width="28" height="24" rx="4" fill="url(#rollerGrad1)" stroke="#fcd34d" stroke-width="1.5"/>
    <ellipse cx="0" cy="-8" rx="14" ry="7" fill="#fbbf24" stroke="#fef08a" stroke-width="1"/>
    <ellipse cx="0" cy="-8" rx="6" ry="3.5" fill="url(#rollerCore)" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Roller 2 (Right-back) -->
  <g transform="translate(84, 44)">
    <rect x="-14" y="-8" width="28" height="24" rx="4" fill="url(#rollerGrad1)" stroke="#fcd34d" stroke-width="1.5"/>
    <ellipse cx="0" cy="-8" rx="14" ry="7" fill="#fbbf24" stroke="#fef08a" stroke-width="1"/>
    <ellipse cx="0" cy="-8" rx="6" ry="3.5" fill="url(#rollerCore)" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Roller 3 (Center-front) -->
  <g transform="translate(60, 72) scale(1.15)">
    <rect x="-15" y="-10" width="30" height="26" rx="4" fill="url(#rollerGrad2)" stroke="#67e8f9" stroke-width="1.5"/>
    <ellipse cx="0" cy="-10" rx="15" ry="7.5" fill="#22d3ee" stroke="#a5f3fc" stroke-width="1"/>
    <ellipse cx="0" cy="-10" rx="7" ry="4" fill="url(#rollerCore)" stroke="#475569" stroke-width="1"/>
  </g>
</svg>
