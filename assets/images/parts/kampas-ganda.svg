<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="clutchMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="padLining" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="clutchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" filter="url(#clutchGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(245, 158, 11, 0.08)" />

  <!-- Center Hub Axis -->
  <circle cx="60" cy="60" r="14" fill="url(#clutchMetal)" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="7" fill="#0f172a"/>

  <!-- 3 Curved Clutch Shoe Arms (120 deg apart) -->
  <!-- Shoe 1 (Top) -->
  <g transform="translate(60,60)">
    <!-- Arm 1 -->
    <path d="M -8 -18 C -4 -38 24 -42 42 -24 C 36 -16 28 -14 16 -16 Z" fill="url(#clutchMetal)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Friction Pad Lining -->
    <path d="M 6 -40 C 22 -44 42 -28 46 -18" fill="none" stroke="url(#padLining)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Arm 2 (Bottom Right) -->
    <g transform="rotate(120)">
      <path d="M -8 -18 C -4 -38 24 -42 42 -24 C 36 -16 28 -14 16 -16 Z" fill="url(#clutchMetal)" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 6 -40 C 22 -44 42 -28 46 -18" fill="none" stroke="url(#padLining)" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Arm 3 (Bottom Left) -->
    <g transform="rotate(240)">
      <path d="M -8 -18 C -4 -38 24 -42 42 -24 C 36 -16 28 -14 16 -16 Z" fill="url(#clutchMetal)" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 6 -40 C 22 -44 42 -28 46 -18" fill="none" stroke="url(#padLining)" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Clutch Return Springs -->
  <circle cx="48" cy="46" r="3" fill="#ef4444"/>
  <circle cx="72" cy="46" r="3" fill="#ef4444"/>
  <circle cx="60" cy="74" r="3" fill="#ef4444"/>
</svg>
