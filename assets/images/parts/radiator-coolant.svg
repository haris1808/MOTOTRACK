<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="coolantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coolLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="coolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" filter="url(#coolGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(16, 185, 129, 0.08)" />

  <!-- Cap -->
  <rect x="52" y="16" width="16" height="10" rx="2" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <rect x="55" y="26" width="10" height="6" fill="#64748b"/>

  <!-- Bottle Body -->
  <path d="M 40 32 L 80 32 C 86 32 90 38 90 46 L 90 94 C 90 100 84 104 78 104 L 42 104 C 36 104 30 100 30 94 L 30 46 C 30 38 34 32 40 32 Z" fill="url(#coolantGrad)" stroke="#6ee7b7" stroke-width="1.5"/>

  <!-- Radiator Grid Graphic on Label -->
  <rect x="38" y="48" width="44" height="46" rx="4" fill="#064e3b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Snow / Cool Wave Graphic -->
  <path d="M 44 64 Q 52 56 60 64 T 76 64" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 74 Q 52 66 60 74 T 76 74" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Coolant Drop -->
  <path d="M 60 78 C 60 78 55 84 55 88 C 55 90.7 57.2 93 60 93 C 62.8 93 65 90.7 65 88 C 65 84 60 78 60 78 Z" fill="#6ee7b7"/>
