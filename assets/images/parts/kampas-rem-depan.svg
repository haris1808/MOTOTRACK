<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="metalPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="frictionMaterial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="brakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="rgba(59, 130, 246, 0.25)" stroke-width="2" filter="url(#brakeGlow)" />
  <circle cx="60" cy="60" r="48" fill="rgba(59, 130, 246, 0.08)" />

  <!-- Pair of Disc Brake Pads -->
  <!-- Pad 1 (Back Layer) -->
  <g transform="translate(48, 52) rotate(-12)">
    <path d="M -30 -16 L 24 -16 C 30 -16 34 -10 34 -4 L 34 16 C 34 22 28 26 22 26 L -24 26 C -30 26 -34 20 -34 14 L -34 -10 C -34 -14 -32 -16 -30 -16 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Mounting Holes -->
    <circle cx="-24" cy="-6" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <circle cx="22" cy="-6" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Pad 2 (Front Layer) -->
  <g transform="translate(64, 66) rotate(6)">
    <!-- Backing Steel Plate -->
    <path d="M -32 -18 L 26 -18 C 32 -18 36 -12 36 -6 L 36 18 C 36 24 30 28 24 28 L -26 28 C -32 28 -36 22 -36 16 L -36 -10 C -36 -16 -34 -18 -32 -18 Z" fill="url(#metalPlateGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    
    <!-- Friction Pad Block (Center) -->
    <rect x="-22" y="-10" width="44" height="28" rx="3" fill="url(#frictionMaterial)" stroke="#f59e0b" stroke-width="1"/>
    <!-- Heat Dissipation Slots -->
    <line x1="-8" y1="-8" x2="-8" y2="16" stroke="#451a03" stroke-width="2"/>
    <line x1="8" y1="-8" x2="8" y2="16" stroke="#451a03" stroke-width="2"/>

    <!-- Mounting Holes -->
    <circle cx="-26" cy="-8" r="4" fill="#0f172a" stroke="#93c5fd" stroke-width="1"/>
    <circle cx="24" cy="-8" r="4" fill="#0f172a" stroke="#93c5fd" stroke-width="1"/>
  </g>
</svg>
